- name: SeliaScan
  cs:
    kind: Naskenovat, uložit, sdílet
    problem: Skenování dokumentů na Androidu by nemělo vyžadovat účet ani správce souborů.
    approach: Snímání zajišťuje skener dokumentů Google ML Kit. OCR běží v zařízení. Začernění se trvale zapisuje do chráněné revize, podpisy a razítka lze použít opakovaně. Orientace se opravuje pouze tehdy, když úhel textových řádků poskytuje spolehlivý podklad.
