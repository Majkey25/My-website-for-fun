# as_of dates the result, because versions and numbers change.

- name: CzechCore
  cs:
    kind: Offline oprava české gramatiky
    problem: Opravovat českou gramatiku přímo v zařízení a vracet přesné rozsahy úprav, které může editor podtrhnout, bez odesílání textu jinam.
    approach: Český korekční model s 60,8 milionu parametrů od ÚFAL čte celou větu. UDPipe určuje přesné rozsahy tokenů a deterministické kontroly chrání URL, e-maily, data, čísla verzí, telefonní čísla a části připomínající kód. Samostatný režim přepisování lokálním LLM vždy vyžaduje kontrolu člověkem. Zdrojové kódy zahrnují klávesnici pro Android a adaptér Windows TSF.
    result: F0,5 dosahuje 0,634 (precision 0,788, recall 0,355) na vývojové sadě GECCC s 8 478 větami, přibližně 229 ms na větu na CPU. Vydáno jako výzkumná alfa, protože stále mění 558 z 3 288 správných vět, což je pro automatické opravy bez potvrzení příliš mnoho.
    as_of: září 2026
  group: ai
  kind: Offline Czech grammar correction
  stack: [Python, PyTorch, CTranslate2, UDPipe]
  problem: Correct Czech grammar on the device, with exact edit ranges an editor can underline, without sending text anywhere.
  approach: A 60.8M-parameter Czech correction model from ÚFAL reads the whole sentence, UDPipe provides exact token ranges, and deterministic guards protect URLs, e-mail addresses, dates, version and phone numbers, and code-like tokens. A separate local-LLM rewrite mode always asks for human review. The source includes an Android keyboard and a Windows TSF adapter.
  specimen: { before: Muži přišly domů., after: Muži přišli domů. }
  result: F0.5 of 0.634 (precision 0.788, recall 0.355) on the GECCC development split of 8,478 sentences, at about 229 ms per sentence on CPU. Released as a research alpha, because it still changes 558 of 3,288 correct sentences, too many for silent autocorrect.
  as_of: Sep 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/CzechCore' }

- name: Music Analyzer
  cs:
    kind: Rozdělení skladeb na šest stop, přehrávač a nastavení hlasitosti jednotlivých stop
    problem: Procvičovat nebo rozebírat jeden part nahrané skladby je obtížné, když jsou všechny nástroje v jednom smíchaném souboru.
    approach: Webová aplikace ve Flasku postavená na knihovnách jako Librosa, Spleeter a Demucs rozdělí nahraný soubor MP3 nebo WAV na šest stop pro zpěv, kytaru, baskytaru, klavír, bicí a ostatní nástroje.
    result: Každou stopu lze zesílit, ztlumit nebo poslechnout samostatně, upravit tempo a upravené stopy stáhnout. Import z YouTube, změna výšky tónu, akordy a notový zápis jsou v README vedené jako plánované, zatím nehotové funkce.
    as_of: listopad 2026
  group: ai
  kind: Separates songs into six stems, with a player and per-stem volume mixing
  stack: [Python]
  problem: Practising or studying one part of a recorded song is hard when every instrument sits in a single mixed file.
  approach: A Flask web app built with libraries such as Librosa, Spleeter and Demucs splits an uploaded MP3 or WAV file into six stems for vocals, guitar, bass, piano, drums and everything else.
  result: Each stem can be turned up, muted or isolated, the tempo adjusted and the edited tracks downloaded. YouTube import, pitch shifting, chord display and sheet music are marked in the README as planned, not built.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/StudentTraineeCenter/music-analyzer' }

- name: Transcriber
  cs:
    kind: Přepis M4A na Androidu pomocí lokálních i cloudových modelů
    problem: Diktafon Samsung Voice Recorder ukládá soubory M4A, ne text, a některé nahrávky by telefon neměly opustit.
    approach: Aplikace sleduje jednu zvolenou složku s nahrávkami a nové soubory přepisuje postupně přes WorkManager. Výchozí režim Local Smart směruje češtinu a francouzštinu na Omnilingual 300M a ostatní jazyky na Whisper Small. Modely Groq, Google, OpenAI a xAI jsou volitelné s vlastním API klíčem, který šifruje Android Keystore.
    result: Po jednorázovém stažení zhruba 741 MB ověřených souborů modelu funguje lokální přepis offline a bez API klíče. Verze 0.3.1 vyžaduje výslovný souhlas před automatickým nahráváním do cloudu a aplikace nemá účet, analytiku, reklamy ani vlastní backend.
    as_of: listopad 2026
  group: ai
  kind: Android M4A transcription with local and cloud models
  stack: [Kotlin, sherpa-onnx, Whisper]
  problem: Samsung Voice Recorder saves M4A files, not text, and some recordings should never leave the phone.
  approach: The app watches one chosen recordings folder and transcribes new files one at a time through WorkManager. The default Local Smart mode routes Czech and French to Omnilingual 300M and other languages to Whisper Small; Groq, Google, OpenAI and xAI models are optional with the user's own API key, encrypted with Android Keystore.
  result: After a one-time download of about 741 MB of verified model files, local transcription works offline without an API key. Version 0.3.1 asks for explicit consent before automatic cloud uploads, and the app has no account, analytics, advertising or custom backend.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/transcriber-android' }

- name: Local Voice
  cs:
    kind: Offline diktování pro Android s plovoucím mikrofonem
    problem: Diktovat do libovolné aplikace na Androidu bez výměny používané klávesnice a s rozpoznáváním řeči přímo v telefonu.
    approach: Překryv přes AccessibilityService přidá přesouvatelné tlačítko mikrofonu pro diktování klepnutím nebo podržením a poslední vložení lze do osmi sekund vrátit. Offline balíček o velikosti 601 MB pokrývá angličtinu, češtinu, němčinu, francouzštinu a španělštinu. Text upravuje slovník pro každý jazyk, zkratky spouštěné přesnou frází a čištění v režimech Raw, Light nebo Polished.
    result: Verze 0.4.2 omezuje stahování modelů a před zkopírováním výsledku do schránky se ptá. Dvouminutová kalibrace hlasu porovná výstup lokálního Whisperu se zobrazeným textem a navrhne opravy do slovníku, model ale nepřetrénovává.
    as_of: listopad 2026
  group: ai
  kind: Offline Android dictation with a floating microphone
  stack: [Kotlin, Whisper]
  problem: Dictate into any Android app without giving up the keyboard already in use, with speech recognised on the phone.
  approach: An AccessibilityService overlay adds a movable microphone button for toggle or push-to-talk dictation, and the last insertion can be undone within eight seconds. A 601 MB offline pack covers English, Czech, German, French and Spanish, while a per-language dictionary, exact-trigger snippets and Raw, Light or Polished cleanup shape the text.
  result: Version 0.4.2 bounds model downloads and asks before copying a result to the clipboard. A two-minute voice calibration compares local Whisper output with the displayed text and proposes dictionary corrections; it does not retrain the model.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/local-voice-android' }

- name: Prompt engineering skill
  cs:
    kind: Převádí úkoly na prompty a pravidla pro agenty s kritérii ověření pro Claude Code, Codex a ChatGPT
    problem: Většina sbírek promptů shromažďuje chytré formulace. Prompt, na který se tým spoléhá, potřebuje jasné zadání a způsob, jak ověřit odpověď.
    approach: Skill převádí hrubý požadavek na smluvené zadání promptu (cíl, kontext, úkol, omezení, formát výstupu, ověření a řešení chyb) podle aktuálních doporučení OpenAI, Anthropic a Googlu. U programovacích promptů se řídí dostupnými podklady z repozitáře a nevymýšlí si chybějící detaily.
    result: Instaluje se jako skill v ChatGPT, Codexu a Claude Code. Obsahuje heuristický linter promptů a generátor výchozích manifestů pro vyhodnocení. U důležitých promptů vede k testovacím případům a iteracím místo odhadování.
    as_of: září 2026
  group: ai
  kind: Turns tasks into prompts and agent rules with built-in verification criteria, for Claude Code, Codex and ChatGPT
  stack: [Python, Markdown]
  featured: { order: 4, area: AI and language }
  problem: Most prompt collections gather clever phrases. A prompt a team relies on needs a clear contract and a way to check what comes back.
  approach: The skill turns a rough request into a prompt contract (objective, context, task, constraints, output format, verification and failure handling), following current OpenAI, Anthropic and Google guidance. Coding prompts are routed by the repository evidence that is available instead of invented details.
  result: Installs as a skill in ChatGPT, Codex and Claude Code. It ships a heuristic prompt linter and a generator for eval starter manifests, and for important prompts it pushes eval cases and iteration instead of guessing.
  as_of: Sep 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/prompt-engineering-skill' }

- name: Project-Guard
  cs:
    kind: Audit projektů na GitHubu
    problem: „Kterým položkám chybí pole nebo odkazy, které náš tým vyžaduje?“ napříč issues, pull requesty a nástěnkami GitHub Projects V2.
    approach: Lokální aplikace ve Streamlitu kontroluje issues, pull requesty a větve podle nastavených pravidel. Lokální HTTP API poskytuje nálezy pro issues a pull requesty. Volitelný LLM asistent s voláním nástrojů vysvětluje nedostatky a připravuje hodnoty polí, které uživatel před použitím zkontroluje.
    result: Běží na vašem počítači. Projektová data posílá pouze GitHub API a zvolenému LLM endpointu, kterým může být lokální Ollama. Exportuje samostatnou offline HTML zprávu. CI vynucuje Pyright strict, Ruff a pytest. Project board nyní tyto kontroly implementuje znovu v TypeScriptu.
    as_of: červenec 2026
  group: tools
  kind: GitHub project audit
  stack: [Python, Streamlit, LLM tool calling]
  problem: '"Which items are missing the fields or links my team expects?" asked across issues, pull requests and Project V2 boards.'
  approach: A local Streamlit app checks issues, pull requests and branches against rules you configure, and a local HTTP API serves the issue and pull request findings. An optional LLM assistant with tool calling explains the gaps and prepares field values you review before they apply.
  result: Runs on your machine; project data goes only to the GitHub API and the LLM endpoint you choose, which can be a local Ollama. Exports a self-contained offline HTML report. CI enforces Pyright strict, Ruff and pytest. Project board now reimplements these checks in TypeScript.
  as_of: Jul 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/Project-Guard' }

- name: GitHub issues and PR export
  cs:
    kind: Export issues a pull requestů včetně komentářů a obrázků do deterministického Markdownu
    problem: Mít čitelnou offline kopii issues a pull requestů, včetně soukromých repozitářů, se všemi komentáři a vloženými obrázky.
    approach: Exportní skripty načítají issues, pull requesty, komentáře i komentáře z code review přes přihlášené GitHub CLI, ukládají surová data JSON pro offline přegenerování a pro každou položku zapíší jeden soubor Markdown s komentáři v původním pořadí. Obrázky z adres GitHub user-attachments, které přes API stáhnout nejde, stahuje krok v prohlížeči přes Playwright a odkazy vedou na lokální soubory.
    result: Opakované běhy vytvářejí stejný Markdown. Stahování obrázků přijímá jen veřejné cíle HTTP(S) s limity například 25 MiB na obrázek a 1 000 obrázků na repozitář v jednom běhu. Neúspěšné obrázky se zapíší pro pozdější opakovaný pokus.
    as_of: listopad 2026
  group: tools
  kind: Exports issues and pull requests with comments and images to deterministic Markdown
  stack: [Python, Playwright]
  problem: Keep a readable offline copy of issues and pull requests, including from private repositories, with every comment and embedded image.
  approach: Export scripts read issues, pull requests, comments and review comments through the authenticated GitHub CLI, keep the raw JSON for offline regeneration and write one Markdown file per item in the original comment order. Images on GitHub user-attachment URLs, which the API cannot download, are fetched by a Playwright browser step and linked as local files.
  result: Repeated runs produce the same Markdown. Image downloads accept only public HTTP(S) destinations, with limits such as 25 MiB per image and 1,000 images per repository run, and failed images are recorded for a later recovery run.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/gh-issues-pr-export' }

- name: ByteNoise
  cs:
    kind: Malý nástroj pro vratné znečitelnění textu s desktopovým a webovým rozhraním
    problem: Aby text na první pohled nevypadal jako běžný čitelný text, ale bez předstírání, že jde o šifrování.
    approach: Bajty UTF-8 se kombinují operací XOR s deterministickou maskou podle pozice a ukládají se jako znaky Unicode od U+0100. Stejný formát používá desktopová aplikace v Tkinteru i statická webová aplikace na GitHub Pages. Dekódování ignoruje vložené mezery a zalomení řádků a přečte i starší formát s přímým posunem.
    result: Obě aplikace zpracují až 1 MiB textu v UTF-8 bez běhových závislostí třetích stran. README výslovně uvádí, že nejde o bezpečné šifrování a nehodí se pro tajné údaje.
    as_of: listopad 2026
  group: tools
  kind: Tiny reversible text obfuscator with a desktop and web UI
  stack: [Python, Tkinter]
  problem: Make text stop looking like plain text at a glance, without pretending to be encryption.
  approach: UTF-8 bytes are XORed with a deterministic, position-based mask and stored as Unicode characters from U+0100. A Tkinter desktop app and a static GitHub Pages web app share the format, and decoding ignores pasted spaces and line breaks and still reads the older direct-offset format.
  result: Both apps handle up to 1 MiB of UTF-8 text with no third-party runtime dependencies. The README states plainly that it is not secure encryption and not meant for secrets.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/ByteNoise' }

- name: Project board
  cs:
    kind: Odděluje fáze projektu od nasazených verzí
    problem: Kanbanová karta může říkat „testování“, ale neřekne, že verze 1.4 je v testování, zatímco 1.3 běží v produkci.
    approach: Projekty procházejí vlastními sloupci a jejich cílové, testovací a produkční verze se sledují odděleně. Obsah nástěnek šifruje AES-256-GCM, přihlášení používá GitHub App s OAuth PKCE a agenti dostávají časově omezené API tokeny s oprávněními, která nikdy nepřesahují oprávnění jejich tvůrce.
    result: Aplikace je v provozu, zdrojový kód je neveřejný. Veřejný workflow denně kontroluje dostupnost, bezpečnostní hlavičky a odpověď 401 při anonymním přístupu k nástěnce. Kontrolu si může kdokoli zopakovat pomocí curl.
    as_of: září 2026
  group: web
  kind: Separates project phases from deployed versions
  stack: [React 19, TypeScript, Cloudflare Workers, D1]
  featured: { order: 1, area: Backend and web }
  source: private
  problem: A kanban card can say "testing", but it cannot say that 1.4 is in testing while 1.3 runs in production.
  approach: Projects move through custom columns while their target, test and production versions are tracked separately. Board content is encrypted with AES-256-GCM, sign-in uses a GitHub App with OAuth PKCE, and agents get scoped, expiring API tokens that never exceed their creator's permissions.
  result: Live, with private source. A public workflow checks the app daily for health, security headers and a 401 on anonymous board access, and anyone can repeat the check with curl.
  as_of: Sep 2026
  links:
    - { label: Live app, href: 'https://project-board.majkeylab.workers.dev' }
    - { label: Showcase, href: 'https://github.com/Majkey25/project-board-showcase' }

- name: RC Audio Lab
  cs:
    kind: RC filtr, který můžete slyšet
    problem: Zápočtový projekt pro Univerzitu Tomáše Bati ve Zlíně, ve kterém lze nabíjení kondenzátoru a filtry prvního řádu vidět i slyšet.
    approach: Filtr běží v AudioWorkletu s koeficienty bilineární transformace předkorigovanými na mezní frekvenci. Rovnice se průběžně doplňují dosazenými hodnotami. A/B srovnání používá kytarový riff sestavený z jednoho nahraného tónu.
    result: Testy v Playwrightu v Chromiu a Firefoxu offline vykreslují produkční audio procesor a porovnávají naměřenou amplitudu a fázi s výpočtem. Výchozí horní propust musí testovací nahrávku zeslabit o více než 20 dB.
    as_of: září 2026
  group: web
  kind: An RC filter you can hear
  stack: [TypeScript, React 19, Web Audio, Vite]
  problem: A credit project for Tomas Bata University in Zlín, to make capacitor charging and first-order filters something you can see and hear.
  approach: The filter runs in an AudioWorklet with bilinear-transform coefficients prewarped at the cutoff. The equations update with the substituted values, and you can switch A/B on a guitar riff built from one recorded note.
  result: Playwright tests in Chromium and Firefox render the production audio processor offline and compare the measured amplitude and phase with the maths; the default high-pass must cut the test recording by more than 20 dB.
  as_of: Sep 2026
  links:
    - { label: Open the lab, href: 'https://majkey25.github.io/rc-audio-lab/' }
    - { label: Repository, href: 'https://github.com/Majkey25/rc-audio-lab' }

