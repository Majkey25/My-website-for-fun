  problem: Pull the text out of any part of the screen to hear it, summarize it or ask about it, with local processing as the default.
  approach: A floating overlay starts a user-approved MediaProjection capture of a selected region, and ML Kit OCR and Android text-to-speech run on the device. Optional summaries and a memory-only chat grounded in the captured text use Groq, Gemini or OpenAI with the user's own key, encrypted with Android Keystore.
  result: Captured text and chat history are not stored by default. Public APK releases stay blocked until signing continuity and a non-debuggable build are in place, and the source is public but proprietary.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/SumRead' }

- name: Tab equalizer
  cs:
    kind: Zvukový ekvalizér pro jednotlivé karty v Chrome, Chromiu a Brave
    problem: Upravit zvuk jedné karty prohlížeče beze změny zbytku prohlížeče nebo systémového zvuku.
    approach: Rozšíření pro Manifest V3 zachytává jen kartu, kterou uživatel zapne, a vede její zvuk přes řetězec Web Audio v offscreen dokumentu s předzesílením, 10pásmovým ekvalizérem, kompresorem, vyvážením nebo monem, hlavní hlasitostí až 200 % a závěrečným limiterem. Nastavení ve výchozím stavu platí jen pro kartu, lze si ho zapamatovat pro web a předvolby se importují a exportují jako JSON.
    result: Podporuje Chrome, Chromium a Brave bez oprávnění k webům, účtů, analytiky a síťových požadavků rozšíření. CI před zveřejněním vydání s kontrolními součty SHA-256 načte skutečné rozbalené rozšíření v Chromium for Testing.
    as_of: listopad 2026
  group: extensions
  kind: Per-tab audio equalizer for Chrome, Chromium and Brave
  stack: [JavaScript, Web Audio, MV3]
  problem: Adjust the sound of one browser tab without changing the rest of the browser or the system audio.
  approach: A Manifest V3 extension captures only a tab the user enables and runs its audio through an offscreen Web Audio chain with preamp, 10-band EQ, compressor, balance or mono, master volume up to 200% and a final limiter. Settings stay per tab by default, can be remembered per site, and presets import and export as JSON.
  result: Supported on Chrome, Chromium and Brave, with no host permissions, accounts, analytics or extension network requests. CI loads the real unpacked extension in Chromium for Testing before it publishes a release with SHA-256 checksums.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/chromium-tab-equalizer' }

- name: No Cookies & Ads
  cs:
    kind: Blokování reklam, sledování, cookies třetích stran a cookie lišt
    problem: Reklamy, sledovací prvky, cookies třetích stran a cookie lišty zahlcují prohlížení a jejich blokování by nemělo vyžadovat telemetrii ani účet.
    approach: Engine AdGuard pro MV3 filtruje požadavky a skrývá prvky stránek s výchozí přísnou sadou filtrů včetně českých a slovenských seznamů a s připnutými doplňky ze seznamů Brave. Rozšíření žádá Chrome o blokování cookies třetích stran a vypnutí Related Website Sets. Strukturální záloha skrývá pevně umístěné lišty souhlasu podle rozvržení, ne podle jazyka stránky, a nikdy za uživatele nepotvrdí souhlas.
    result: Licence GPL-3.0, bez analytiky, telemetrie, účtu a vzdáleně spouštěného kódu. Testy v prohlížeči načítají zabalené rozšíření v izolovaném profilu Chromia a kontrolují cookie překryvy, posouvání, běžné dialogy a výjimky pro weby. README upozorňuje, že skrytí lišty neznamená odmítnutí souhlasu.
    as_of: listopad 2026
  group: extensions
  kind: Blocks ads, trackers, third-party cookies and cookie banners
  stack: [JavaScript, MV3, AdGuard rules]
  problem: Ads, trackers, third-party cookies and cookie banners clutter browsing, and blocking them should not need telemetry or an account.
  approach: The AdGuard MV3 engine filters requests and hides page elements with a strict preset on by default, including Czech and Slovak lists, plus pinned Brave list additions. The extension asks Chrome to block third-party cookies and disable Related Website Sets, and a structural fallback hides fixed consent containers by layout rather than page language, without ever clicking Accept.
  result: GPL-3.0 licensed, with no analytics, telemetry, account or remote executable code. Browser tests load the packaged extension in an isolated Chromium profile to check cookie overlays, scrolling, ordinary dialogs and allowlisting. The README notes that hiding a banner does not reject consent.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/no-cookies-ads' }

- name: YouTube skipper
  cs:
    kind: Přeskakování úseků nahlášených komunitou SponsorBlock
    problem: Přeskakovat sponzorované úseky a další části videí na YouTube nahlášené komunitou, aniž by rozšíření potřebovalo přístup ke všem webům.
    approach: Dotazy na SponsorBlock posílají jen první čtyři znaky hashe SHA-256 z ID videa a rozšíření si z vrácené skupiny vybere přesné video. Každou kategorii lze přeskočit automaticky, zobrazit pro ni tlačítko nebo ji ignorovat. Ve výchozím stavu se automaticky přeskakují sponzorované úseky a vlastní propagace a značky na časové ose jsou volitelné.
    result: Funguje na YouTube, YouTube Music a mobilní verzi YouTube s přístupem jen k těmto stránkám a k API SponsorBlock. Odpovědi zůstávají v paměti deset minut a dotazy nad limit nechají přehrávání běžet bez přeskakování.
    as_of: listopad 2026
  group: extensions
  kind: Skips SponsorBlock community-reported segments
  stack: [JavaScript, MV3]
  problem: Skip sponsor segments and other community-reported parts of YouTube videos without giving an extension access to every website.
  approach: SponsorBlock lookups send only the first four characters of the video ID's SHA-256 hash, and the extension picks the exact video from the returned group. Each category can skip automatically, show a skip button or be ignored; Sponsor and Self promotion skip by default, and timeline markers are optional.
  result: Works on YouTube, YouTube Music and mobile YouTube pages, with access only to those pages and the SponsorBlock API. Responses are cached in memory for ten minutes, and over-limit lookups leave playback running without skipping.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/youtube-skipper' }

- name: Songsterr auto continue
  cs:
    kind: Automatické kliknutí na bezplatné pokračování s pauzami při synchronizaci v Songsterru
    problem: Bezplatné přehrávání Original Audio na Songsterru přeruší výzva, na kterou je pokaždé potřeba kliknout, aby přehrávání pokračovalo s pauzami při synchronizaci.
    approach: Jeden content script hlídá viditelný dialog s přerušením a aktivuje jen akci s přesným textem „continue with sync pauses“. Opakuje ji každých 50 ms, dokud výzva skutečně nezmizí, protože web kliknutí přijímá zhruba až po 450 ms. Rozpoznává vlastní ovládací prvky dialogu, ne generované názvy tříd ani text nadpisu, které se na živém webu už změnily.
    result: Verze 0.1.10 běží jen na songsterr.com bez dalších oprávnění, nastavení, síťových požadavků a analytiky. Nikdy neklikne na Upgrade ani Use Synth a pauzy při synchronizaci zachovává. Testy načítají skutečné rozšíření v Chromiu nad kódem výzvy zachyceným z živého webu.
    as_of: listopad 2026
  group: extensions
  kind: Clicks Songsterr's free "continue with sync pauses" action
  stack: [JavaScript, MV3, Playwright]
  problem: Free Original Audio playback on Songsterr stops at a prompt that has to be clicked each time to continue with sync pauses.
  approach: One content script watches for a visible interruption dialog and activates only the action whose exact text is "continue with sync pauses", repeating every 50 ms until the prompt is really gone, because the site starts accepting the click only after about 450 ms. It matches the dialog's own controls rather than generated class names or headline text, which the live site has already changed.
  result: Version 0.1.10 runs only on songsterr.com with no extra permissions, settings, network requests or analytics. It never clicks Upgrade or Use Synth and keeps Songsterr's sync pauses, and tests load the real extension in Chromium against prompt markup captured from the live site.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/songsterr-auto-continue' }

- name: Tab copy
  cs:
    kind: Kopírování URL vybraných karet v jejich pořadí
    problem: Zkopírovat URL vybraných karet prohlížeče ve skutečném pořadí a seznam odkazů zase otevřít jako karty.
    approach: V okně rozšíření se karty vybírají kliknutím nebo s klávesou Shift a tlačítko COPY zapíše jednu URL na řádek v pořadí karet. Vložení čte schránku až po kliknutí, vybere odkazy HTTP(S) z textu, Markdownu, HTML, JSON nebo CSV a otevře je ve stejném pořadí v novém okně.
    result: Funguje v prohlížečích založených na Chromiu s podporou Manifest V3, včetně Chrome a Edge, bez analytiky, ukládání dat, backendu a běhových závislostí. Jedno vložení otevře nejvýše 100 odkazů a odkazy s jinými protokoly ignoruje.
    as_of: listopad 2026
  group: extensions
  kind: Copies the URLs of selected tabs in order
  stack: [JavaScript, MV3]
  problem: Copy the URLs of chosen browser tabs in their real order, and reopen a list of links as tabs.
  approach: In the popup, a click or Shift-click selects tabs and COPY writes one URL per line in tab order. Pasting reads the clipboard only after a click, extracts HTTP(S) links from text, Markdown, HTML, JSON or CSV and opens them in order in a new window.
  result: Works in Manifest V3 Chromium browsers, including Chrome and Edge, with no analytics, storage, backend or runtime dependencies. One paste opens at most 100 links, and links with other protocols are ignored.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/tab-copy-extension' }

