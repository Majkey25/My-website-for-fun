- name: Media Downloader
  cs:
    kind: Stahování jednoho audio nebo video souboru z veřejné URL se zabezpečeným backendem
    problem: Stáhnout jeden zvukový nebo video soubor z veřejné URL přes malou hostovanou službu, která musí zůstat bezpečná a v přísných serverových limitech.
    approach: Statický frontend na GitHub Pages volá backend s Flaskem a FFmpeg na alwaysdata. Hlavním nástrojem je yt-dlp a připnutá verze youtube-dl slouží jako záloha jen pro přímé odkazy na jedno video z YouTube. Každá úloha běží v izolovaném pomocném procesu, obecný extraktor je vypnutý a všechny výsledky DNS musí být globálně směrovatelné, aby se snížilo riziko server-side request forgery.
    result: Produkční nastavení omezuje média na 120 minut a 216 MiB na soubor, zpracovává jednu extrakci najednou a každému klientovi povoluje pět operací za hodinu. Média s DRM, za paywallem, soukromá a probíhající živá vysílání se odmítají. Hotové soubory se plánovaně mažou hned po úplném stažení, opuštěné po 10 nebo 30 minutách podle velikosti.
    as_of: listopad 2026
  group: web
  kind: Downloads one audio or video file from a public URL, with a hardened backend
  stack: [Python, Flask, FFmpeg]
  problem: Fetch one audio or video file from a public media URL through a small hosted service that has to stay safe and inside tight server limits.
  approach: A static GitHub Pages front end calls a Flask and FFmpeg backend on alwaysdata. yt-dlp is the main engine, with a pinned youtube-dl fallback only for direct single YouTube videos; each job runs in an isolated helper process, the generic extractor is disabled and every DNS result must be globally routable, to reduce server-side request forgery risk.
  result: The production profile caps media at 120 minutes and 216 MiB per file, runs one extraction job at a time and allows each client five operations an hour. DRM, paywalled, private and active live media is refused, and ready files are scheduled for removal right after a complete download, or after 10 or 30 minutes by size if abandoned.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/youtube_downloader' }

- name: DownloadGithubDir
  cs:
    kind: Stažení složky z GitHub repozitáře jako ZIP přímo v prohlížeči
    problem: Stáhnout jednu složku z repozitáře na GitHubu bez klonování celého repozitáře.
    approach: Stránka načte obsah složky přes GitHub Git Trees API, soubory stáhne paralelně a v prohlížeči je zabalí do ZIPu pomocí JSZip. Volitelná větev, tag nebo token umožní stáhnout konkrétní verzi, získat vyšší limity API nebo přistoupit k soukromým repozitářům. Token se posílá jen na adresy GitHub API a nikam se neukládá.
    result: Verze 1.0.1 běží jako statická stránka na GitHub Pages. Kvůli paměti prohlížeče končí na 4 000 souborech nebo 250 MiB a odmítne zkrácené stromy, složky se submoduly i nebezpečné názvy souborů, místo aby vytvořila neúplný ZIP.
    as_of: listopad 2026
  group: web
  kind: Downloads a GitHub repository folder as a ZIP, entirely in the browser
  stack: [JavaScript, JSZip]
  problem: Download a single folder from a GitHub repository without cloning the whole repository.
  approach: The page lists the folder through GitHub's Git Trees API, fetches the files in parallel and packs them into a ZIP with JSZip, entirely in the browser. An optional branch, tag or token covers specific releases, higher rate limits and private repositories; the token goes only to GitHub API URLs and is never stored.
  result: Version 1.0.1 runs as a static page on GitHub Pages. To bound browser memory it stops at 4,000 files or 250 MiB, and it refuses truncated trees, folders with submodules and unsafe file names instead of producing a partial ZIP.
  as_of: Nov 2026
  links:
    - { label: Open, href: 'https://majkey25.github.io/DownloadGithubDir/' }
    - { label: Repository, href: 'https://github.com/Majkey25/DownloadGithubDir' }

