  approach: Exact coordinates, address search through Android's geocoder or city presets feed a foreground service that keeps the mock location active until it is stopped from the app or the notification. The Google Play build has no Internet permission or VPN service; the separate GitHub build adds an embedded WireGuard client for a configuration the user imports.
