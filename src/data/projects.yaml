- name: Selia Weather
  cs:
    kind: Předpověď, která uvádí své zdroje
    problem: Modely počasí se rozcházejí a jediná předpověď to skrývá. Čeští uživatelé navíc očekávají data ČHMÚ.
    approach: Aplikace načítá několik rodin modelů a při alespoň třech hodnotách počítá robustní medián přímo v zařízení. Pro české lokality přidává ČHMÚ ALADIN, pozorovaný radar, mapy DWD ICON a pětiletý archiv NASA POWER. Detail uvádí, které modely přispěly.
    result: Při zpětném vyhodnocení teplot na 313 případech měl medián tří modelů nižší souhrnnou chybu než Open-Meteo Best Match. Zpráva zachovává neúspěchy na jednotlivých stanicích a aplikace netvrdí, že je přesnější než ostatní.
    as_of: září 2026
  group: android
  kind: A forecast that names its sources
  stack: [Kotlin, Jetpack Compose]
  featured: { order: 5, area: Android apps }
  problem: Weather models disagree and a single forecast hides it. Czech users also expect ČHMÚ data.
  approach: The app requests several model families and computes a robust median on the device when at least three values exist. It adds ČHMÚ ALADIN for Czech locations, observed radar, DWD ICON maps and a five-year NASA POWER archive, and the details screen lists which models contributed.
  result: In a 313-case temperature replay a three-model median had a lower pooled error than Open-Meteo Best Match. The report keeps the station-level failures, and the app makes no claim of superior accuracy.
  as_of: Sep 2026
  links:
