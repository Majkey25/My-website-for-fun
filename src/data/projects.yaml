  group: earlier
  kind: Monte Carlo simulation of Buffon's needle
  stack: [JavaScript, Chart.js]
  problem: Make Buffon's needle problem visible by setting its theoretical crossing probability beside a simulation.
  approach: A static page computes the theoretical intersection probability and runs an animated Monte Carlo simulation with a seeded random generator, so runs can be repeated exactly. Throws are drawn on a canvas and the results plotted live with Chart.js.
  result: Runs on GitHub Pages with no backend or build tools, in Czech and English, on desktop and mobile.
