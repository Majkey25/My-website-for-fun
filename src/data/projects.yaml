    problem: Zviditelnit úlohu Buffonovy jehly porovnáním teoretické pravděpodobnosti protnutí se simulací.
    approach: Statická stránka spočítá teoretickou pravděpodobnost protnutí a spustí animovanou simulaci Monte Carlo s generátorem náhodných čísel řízeným seedem, takže běhy lze přesně zopakovat. Hody se kreslí na canvas a výsledky se průběžně vykreslují do grafů v Chart.js.
