- name: scrollit
  cs:
    kind: Plovoucí nástroj pro automatické posouvání
    problem: Číst dlouhou stránku na Androidu bez dotyku vyžaduje plynulé automatické posouvání, jenže mnoho aplikací, včetně Ultimate Guitar Tabs, ignoruje kolečko myši.
    approach: Přetahovatelný plovoucí ovladač nad ostatními aplikacemi spouští a zastavuje posouvání a nastavuje rychlost ve 30 úrovních. Režim Touch používá gesta přes službu přístupnosti, režim AutoScroll přes Shizuku drží jeden systémový dotyk a posouvá ho každých 16 ms, takže posun je plynulý podobně jako posouvání prostředním tlačítkem myši ve Windows.
    result: Vydáno na GitHubu jako APK v1.0.0 podepsané ladicím klíčem pro Android 14 a novější, určené pro telefony Samsung. Verze 1.0.1 žádá výslovný souhlas s gesty přístupnosti a odstraňuje nepoužívaný přístup k obsahu obrazovky. Když zvolený způsob posouvání není dostupný, aplikace zobrazí chybu a potichu nepřepne na jiný režim.
    as_of: listopad 2026
  group: android
  kind: Floating auto-scroll utility
  stack: [Kotlin, Shizuku]
  problem: Reading a long page on Android without touching the screen needs steady automatic scrolling, yet many apps, including Ultimate Guitar Tabs, ignore mouse-wheel events.
  approach: A draggable floating overlay starts and stops scrolling in other apps and sets one of 30 speed levels. Touch mode uses Accessibility gestures; AutoScroll mode uses Shizuku to hold one system-level touch and move it every 16 ms, which gives a continuous scroll similar to middle-click scrolling on Windows.
  result: Released on GitHub as a debug-signed v1.0.0 APK for Android 14 and newer, made for Samsung phones. Version 1.0.1 asks for explicit Accessibility consent and drops unused screen-content access, and when the selected backend is unavailable the app shows an error instead of silently switching modes.
  as_of: Nov 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/scrollit' }

