name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Format, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm ci --prefix chat
      - run: npm audit --audit-level=high --prefix chat
      - run: npm run check --prefix chat
      - run: npm test --prefix chat
      # Processed images are cached per workflow; rebuilding them all takes minutes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-${{ github.workflow }}-${{ hashFiles('src/assets/**', 'package-lock.json', 'astro.config.mjs') }}
          restore-keys: astro-${{ github.workflow }}-
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:fonts
      - run: npm run build -- --timings
      - run: node --test tests/output.test.mjs
      - run: node scripts/check-output.mjs
      - run: npm run test:contacts
      - run: npm run test:chat
      # Lighthouse on the built site; fails on accessibility, SEO or best-practice regressions
      # and on a performance score below 0.8 (shared runners are noisy, so the bar sits lower).
      - run: npm run lighthouse
